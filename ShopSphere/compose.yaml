services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shopsphere
      MYSQL_USER: shopsphere
      MYSQL_PASSWORD: ${SHOP_DB_PASSWORD:-local-coursework-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-only}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SHOP_DB_URL: jdbc:mysql://mysql:3306/shopsphere?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Kolkata
      SHOP_DB_USER: shopsphere
      SHOP_DB_PASSWORD: ${SHOP_DB_PASSWORD:-local-coursework-only}
      SHOP_ADMIN_PASSWORD: ${SHOP_ADMIN_PASSWORD:-Admin@12345}
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql_data:
